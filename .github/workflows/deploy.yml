
name: Deploy React Travel to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build React application
        run: |
          echo "Configured API URL: $VITE_APP_BASEURL"
          npm run build
          echo "Checking generated JavaScript:"
          grep -R -n -E 'tail480b34|deviantdev' dist/assets || true
        env:
          VITE_APP_BASEURL: https://desktop-vl22pb4.tail480b34.ts.net

      - name: Verify production API URL
        run: |
          echo "Checking built JavaScript for API URLs"
          grep -R -o -E 'https?[^" ]*(tail480b34|deviantdev)[^" ]*' dist/assets || true
          
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
